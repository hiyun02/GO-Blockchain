<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Start HotStuff Consensus</title>
</head>
<body>

<h1>진료 정보</h1>

<p>HotStuff 합의로 확정할 진료 정보를 입력하세요.</p>

<textarea id="json" rows="15" cols="70">
{
  "clinic_id": "VID-00001",
  "info": {"title":"Demo","region":"KR"},
  "fingerprint": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
  "storage_addr": "s3://bucket/a.mp4",
  "drm": null,
  "timestamp": "2025-11-17T01:15:44Z"
}
</textarea>
<br><br>

<button onclick="submitConsensus()">합의 요청</button>

<pre id="out"></pre>

<script>
    function submitConsensus() {
        const body = document.getElementById('json').value;

        fetch('/mine', {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: body
        })
            .then(r => r.json())
            .then(d => {
                document.getElementById('out').innerText = JSON.stringify(d, null, 2);
            });
    }
</script>


</body>
</html>
